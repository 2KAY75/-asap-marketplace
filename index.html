<script>
const API_URL = "https://asap-marketplace-api.onrender.com";

let cart = JSON.parse(localStorage.getItem("asap_cart") || "[]");
let authToken = localStorage.getItem("asap_token") || "";
let currentUser = JSON.parse(localStorage.getItem("asap_user") || "null");

function openModal(id) {
  document.getElementById(id).classList.add("active");
}

function closeModal(id) {
  document.getElementById(id).classList.remove("active");
}

function showToast(message) {
  const toast = document.getElementById("toast");

  if (!toast) {
    alert(message);
    return;
  }

  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}

/* =========================
   AUTH
========================= */

async function login(event) {
  event.preventDefault();

  const identity =
    document.getElementById("loginIdentity").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  try {
    const response = await fetch(
      `${API_URL}/api/auth/login`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          identity,
          password
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      showToast(data.message || "Login failed.");
      return;
    }

    authToken = data.token;
    currentUser = data.user;

    localStorage.setItem("asap_token", authToken);
    localStorage.setItem(
      "asap_user",
      JSON.stringify(currentUser)
    );

    closeModal("loginModal");

    updateAccountUI();

    showToast("Login successful 🎉");

  } catch (error) {
    console.error(error);
    showToast("Unable to connect to ASAP server.");
  }
}


async function signup(event) {
  event.preventDefault();

  const name =
    document.getElementById("signupName").value.trim();

  const phone =
    document.getElementById("signupPhone").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const referral_code =
    document.getElementById("signupReferral").value
      .trim()
      .toUpperCase();

  try {
    const response = await fetch(
      `${API_URL}/api/auth/register`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name,
          phone,
          email,
          password,
          referral_code
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      showToast(data.message || "Registration failed.");
      return;
    }

    authToken = data.token;
    currentUser = data.user;

    localStorage.setItem("asap_token", authToken);
    localStorage.setItem(
      "asap_user",
      JSON.stringify(currentUser)
    );

    closeModal("signupModal");

    updateAccountUI();

    showToast("Account created successfully 🎉");

  } catch (error) {
    console.error(error);
    showToast("Unable to connect to ASAP server.");
  }
}


/* =========================
   ACCOUNT
========================= */

function updateAccountUI() {

  const nameElement =
    document.getElementById("accountName");

  const emailElement =
    document.getElementById("accountEmail");

  if (!currentUser) {
    if (nameElement)
      nameElement.textContent = "Guest";

    if (emailElement)
      emailElement.textContent =
        "Login to access your account";

    return;
  }

  if (nameElement)
    nameElement.textContent = currentUser.name;

  if (emailElement)
    emailElement.textContent = currentUser.email;
}


async function loadAccount() {

  if (!authToken) {
    updateAccountUI();
    return;
  }

  try {

    const response = await fetch(
      `${API_URL}/api/auth/me`,
      {
        headers: {
          "Authorization":
            `Bearer ${authToken}`
        }
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {

      logout(false);
      return;
    }

    currentUser = data.user;

    localStorage.setItem(
      "asap_user",
      JSON.stringify(currentUser)
    );

    updateAccountUI();

  } catch (error) {
    console.error(error);
  }
}


function logout(showMessage = true) {

  authToken = "";
  currentUser = null;

  localStorage.removeItem("asap_token");
  localStorage.removeItem("asap_user");

  updateAccountUI();

  if (showMessage)
    showToast("You have been logged out.");
}


/* =========================
   REFERRALS
========================= */

async function loadReferrals() {

  if (!authToken) {
    showToast("Please login first.");
    openModal("loginModal");
    return;
  }

  try {

    const response = await fetch(
      `${API_URL}/api/referrals`,
      {
        headers: {
          "Authorization":
            `Bearer ${authToken}`
        }
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      showToast(data.message || "Unable to load referrals.");
      return;
    }

    const codeElements =
      document.querySelectorAll(
        "#referralCode"
      );

    codeElements.forEach(element => {
      element.textContent =
        data.referral_code;
    });

    showToast(
      `${data.total_referrals} referral(s) found.`
    );

  } catch (error) {
    console.error(error);
    showToast("Unable to load referral information.");
  }
}


/* =========================
   SELLER APPLICATION
========================= */

async function submitSellerApplication() {

  if (!authToken) {
    showToast("Please login first.");
    openModal("loginModal");
    return;
  }

  const businessName =
    document.querySelector(
      '#sellerModal input[placeholder="Your fabric business"]'
    )?.value.trim();

  const phone =
    document.querySelector(
      '#sellerModal input[placeholder="080..."]'
    )?.value.trim();

  const category =
    document.querySelector(
      "#sellerModal select"
    )?.value;

  if (!businessName || !phone) {
    showToast("Please complete the seller information.");
    return;
  }

  try {

    const response = await fetch(
      `${API_URL}/api/sellers`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization":
            `Bearer ${authToken}`
        },
        body: JSON.stringify({
          business_name: businessName,
          phone,
          category
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      showToast(
        data.message ||
        "Seller application failed."
      );
      return;
    }

    closeModal("sellerModal");

    showToast(
      "Seller application submitted ✅"
    );

  } catch (error) {
    console.error(error);
    showToast("Unable to connect to ASAP server.");
  }
}


/* =========================
   CART
========================= */

function saveCart() {
  localStorage.setItem(
    "asap_cart",
    JSON.stringify(cart)
  );
}


function addToCart(name, price) {

  const existing =
    cart.find(item => item.name === name);

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({
      name,
      price,
      quantity: 1
    });
  }

  saveCart();
  updateCart();

  showToast("Added to cart 🛒");
}


function removeCart(index) {

  cart.splice(index, 1);

  saveCart();
  updateCart();
}


function updateCart() {

  const container =
    document.getElementById("cartItems");

  const totalElement =
    document.getElementById("cartTotal");

  if (!container || !totalElement)
    return;

  if (cart.length === 0) {

    container.innerHTML =
      '<div class="empty">Your cart is empty.</div>';

    totalElement.textContent = "₦0";

    return;
  }

  let total = 0;

  container.innerHTML =
    cart.map((item, index) => {

      const subtotal =
        item.price * item.quantity;

      total += subtotal;

      return `
        <div class="cart-item">

          <div>
            <strong>${escapeHTML(item.name)}</strong>
            <br>
            <small>
              ${item.quantity} ×
              ₦${item.price.toLocaleString()}
            </small>
          </div>

          <div>
            <strong>
              ₦${subtotal.toLocaleString()}
            </strong>

            <br>

            <button
              onclick="removeCart(${index})"
              style="background:none;color:#b00020;font-size:12px;">
              Remove
            </button>
          </div>

        </div>
      `;

    }).join("");

  totalElement.textContent =
    "₦" + total.toLocaleString();
}


function openCart() {

  updateCart();

  openModal("cartModal");
}


/* =========================
   CHECKOUT PLACEHOLDER
========================= */

function checkout() {

  if (cart.length === 0) {
    showToast("Your cart is empty.");
    return;
  }

  if (!authToken) {
    closeModal("cartModal");
    showToast("Login before checkout.");
    openModal("loginModal");
    return;
  }

  showToast(
    "Payment gateway will be connected next."
  );
}


/* =========================
   SEARCH
========================= */

function searchProducts() {

  const query =
    document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const products =
    document.querySelectorAll(".product");

  products.forEach(product => {

    const name =
      product.dataset.name
        .toLowerCase();

    product.style.display =
      !query ||
      name.includes(query)
        ? ""
        : "none";
  });

  scrollProducts();
}


/* =========================
   REFERRAL SHARING
========================= */

function getReferralCode() {

  if (currentUser &&
      currentUser.referral_code) {

    return currentUser.referral_code;
  }

  return "ASAP-MELLOW7X";
}


function getReferralLink() {

  return (
    window.location.origin +
    "/?ref=" +
    encodeURIComponent(
      getReferralCode()
    )
  );
}


function copyReferral() {

  const code =
    getReferralCode();

  navigator.clipboard
    .writeText(code)
    .then(() => {
      showToast(
        "Referral code copied!"
      );
    })
    .catch(() => {
      showToast(
        "Unable to copy code."
      );
    });
}


async function shareReferral() {

  const link =
    getReferralLink();

  const text =
    "Join ASAP Marketplace and shop fabrics & Aso Ebi.";

  if (navigator.share) {

    try {

      await navigator.share({
        title: "ASAP Marketplace",
        text,
        url: link
      });

    } catch (error) {
      console.log(error);
    }

  } else {

    navigator.clipboard
      .writeText(link)
      .then(() => {
        showToast(
          "Referral link copied!"
        );
      });
  }
}


/* =========================
   NAVIGATION
========================= */

function scrollHome() {

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function scrollProducts() {

  const element =
    document.getElementById("products");

  if (element) {

    element.scrollIntoView({
      behavior: "smooth"
    });
  }
}


function scrollAsoEbi() {

  scrollProducts();
}


function openAccount() {

  openModal("accountModal");

  updateAccountUI();
}


/* =========================
   AUTH MODAL SWITCHING
========================= */

function switchToSignup() {

  closeModal("loginModal");

  openModal("signupModal");
}


function switchToLogin() {

  closeModal("signupModal");

  openModal("loginModal");
}


function forgotPassword() {

  showToast(
    "Password recovery will be added next."
  );
}


/* =========================
   SELLER
========================= */

function openSeller() {

  if (!authToken) {

    closeModal("accountModal");

    openModal("loginModal");

    showToast(
      "Login to become an ASAP seller."
    );

    return;
  }

  closeModal("accountModal");

  openModal("sellerModal");
}


function sellerSubmit() {

  submitSellerApplication();
}


/* =========================
   REFERRAL DASHBOARD
========================= */

async function openReferralDashboard() {

  if (!authToken) {

    closeModal("accountModal");

    openModal("loginModal");

    showToast(
      "Login to access referrals."
    );

    return;
  }

  closeModal("accountModal");

  openModal("referralModal");

  await loadReferrals();
}


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================
   REFERRAL URL DETECTION
========================= */

function detectReferralCode() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const referral =
    params.get("ref");

  if (referral) {

    const input =
      document.getElementById(
        "signupReferral"
      );

    if (input) {
      input.value =
        referral.toUpperCase();
    }

    localStorage.setItem(
      "asap_referral",
      referral.toUpperCase()
    );
  }
}


/* =========================
   INITIALIZATION
========================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateCart();

    updateAccountUI();

    detectReferralCode();

    if (authToken) {
      loadAccount();
    }

  }
);
</script>
